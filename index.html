.rs{display:flex;gap:8px;margin:10px 0}

    var tot=a.mins*60000,left=tot-(now-a.start),late=left<0;

// Time estimate: setup + walking in a ~2,000 m2 warehouse + handling per box weight class + extra trips when cart is full
var KG=[1,6,15],SEC=[15,25,45],CART=120;
function boxes(){return [Math.max(0,Math.floor(+$("b").value||0)),+$("t").value||1]}
function est(c){
  var n=c[0],k=c[1];if(!n)return 0;
  var kg=n*6*k;
  return CFG.setup+n*CFG.walk+n*CFG.handle*k+(Math.max(1,Math.ceil(kg/CFG.cart))-1)*90;
}
function factor(){
  var r=S.done.filter(function(a){return a.est}).slice(0,20).map(function(a){return (a.end-a.start)/1000/a.est});
  if(r.length<3)return{f:1,n:r.length};
  var f=r.reduce(function(x,y){return x+y},0)/r.length;
  return{f:Math.min(2,Math.max(0.5,f)),n:r.length};
}
function upd(){
  var c=boxes(),n=c[0];
  if(!n){$("sg").textContent="Enter the boxes to get a suggested time.";return}
  var F=factor(),m=Math.max(1,Math.ceil(est(c)*F.f*(1+CFG.buf/100)/60));

  $("sg").textContent="Suggested: "+m+" min for "+n+" boxes. "+(F.n>=3?"Adjusted from your last "+F.n+" finished orders.":"Standard estimate; it adapts after 3 finished orders.");
}

  S.done.filter(function(a){return a.end>=from.getTime()}).forEach(function(a){

  });
  var ns=Object.keys(g).sort(function(x,y){return g[y].ok/g[y].n-g[x].ok/g[x].n});

  Array.prototype.forEach.call(document.querySelectorAll(".seg button"),function(b){b.className=(+b.dataset.p===per?"":"ghost")});
}

  return [h].concat(S.done.slice().reverse().map(function(a){

    md.innerHTML='<div style="max-width:720px;margin:0 auto"><div class="row" style="margin:0 0 10px"><h1 style="margin:0">'+title+'</h1><button id="'+closeId+'" type="button" class="ghost">Close</button></div><div id="'+bodyId+'"></div></div>';
    document.body.appendChild(md);
    $(closeId).onclick=function(){md.hidden=true;document.body.style.overflow=""};

  }
  var mm=mkModal("Manager access","mmx","mmb"),mmC=null;
  // every company starts with the same empty pages as the first one (pickers, expirations, broken list, warehouse map)
  var SEED={roster:{list:[]},expmeta:{n:0},brkmeta:{n:0},mapmeta:{n:0}};
  window.seedB=function(b,cid){Object.keys(SEED).forEach(function(k){b.set(RAW.doc("companies/"+cid+"/app/"+k),JSON.parse(JSON.stringify(SEED[k])))})};
  function seedMissing(cid){
    return Promise.all(Object.keys(SEED).map(function(k){
      var r=RAW.doc("companies/"+cid+"/app/"+k);
      return r.get().then(function(x){if(!x.exists)return r.set(JSON.parse(JSON.stringify(SEED[k])))});
    })).catch(function(){});
  }
  window.seedMissing=seedMissing;
  function openCo(id){

  function ownerDraw(){
    ow.innerHTML='<h2 style="margin-top:0">Your companies</h2><div id="ocl" class="meta">Loading...</div>'

  });
  // ask the owner for their password (field is hidden as dots) and check it with Firebase
  function askPw(msg){
    return new Promise(function(res,rej){
      var u=firebase.auth().currentUser;
      var o=document.createElement("div");
      o.style.cssText="position:fixed;top:0;right:0;bottom:0;left:0;z-index:120;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:20px";
      o.innerHTML='<div style="background:var(--card);color:var(--ink);border-radius:16px;padding:20px;max-width:360px;width:100%"><h2 style="margin:0 0 8px">Confirm with your password</h2><div class="meta" style="margin-bottom:10px">'+esc(msg)+'</div><input id="apw" type="password" autocomplete="current-password" placeholder="Your owner password"><div id="apm" class="meta" style="color:#c0392b;min-height:18px;margin-top:6px"></div><div class="row"><button id="apo" type="button">Confirm</button><button id="apc" type="button" class="ghost">Cancel</button></div></div>';
      document.body.appendChild(o);
      function done(){o.remove()}
      $("apc").onclick=function(){done();rej("cancel")};
      $("apo").onclick=function(){
        var pw=$("apw").value;if(!pw)return;
        $("apo").disabled=true;
        u.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(u.email,pw)).then(function(){done();res()}).catch(function(){$("apm").textContent="Wrong password.";$("apo").disabled=false;$("apw").value=""});
      };
      $("apw").focus();
    });
  }
  // ----- delete a company and everything in it (cannot be undone) -----
  function delCo(id){
    if(!confirm("Delete company "+id+" and ALL its data (orders, records, expirations, map, staff access)? This cannot be undone."))return;
    var t=prompt("To confirm, type the company ID: "+id);
    if(t===null)return;
    if(String(t).trim().toLowerCase()!==id.toLowerCase()){alert("The ID did not match. Nothing was deleted.");return}
    askPw("Deleting company "+id+" cannot be undone.").then(function(){return doDel(id)}).catch(function(e){if(e!=="cancel")dbe(e)});
  }
  function doDel(id){
    var cols=["active","app","hist","log","audit","people"];
    return Promise.all(cols.map(function(c){return RAW.collection("companies/"+id+"/"+c).get()}).concat([RAW.collection("members").where("cid","==",id).get()])).then(function(rs){
      var all=[];
      rs.forEach(function(r,i){r.docs.forEach(function(d){all.push(i<cols.length?RAW.doc("companies/"+id+"/"+cols[i]+"/"+d.id):RAW.doc("members/"+d.id))})});
      all.push(RAW.doc("companies/"+id));
      var chain=Promise.resolve();
      for(var k=0;k<all.length;k+=400){(function(part){chain=chain.then(function(){var bb=RAW.batch();part.forEach(function(r){bb.delete(r)});return bb.commit()})})(all.slice(k,k+400))}
      return chain.then(function(){return all.length});
    }).then(function(n){alert("Company "+id+" was deleted ("+n+" records).");lst()});
  }
  function create(){
    var name=$("pn").value.trim(),id=slug($("pi").value||name),nm=$("po").value.trim(),em=$("pe").value.trim().toLowerCase();
    if(!name||!id||!nm||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){alert("Fill in the company name, ID, manager name and a valid manager email.");return}
    askPw("Adding company "+name+".").then(function(){return Promise.all([RAW.doc("companies/"+id).get(),RAW.doc("members/"+em).get()]).then(function(r){
      if(r[0].exists){alert("A company with this ID already exists.");return}
      if(r[1].exists){alert("This email already belongs to a company.");return}
      var u=firebase.auth().currentUser,b=RAW.batch(),now=Date.now();
      b.set(RAW.doc("companies/"+id),{name:name,active:true,owner:em,createdAt:now,settings:{}});
      b.set(RAW.doc("members/"+em),{email:em,cid:id,role:"owner",name:nm,by:u.email,at:now});
      b.set(RAW.doc("companies/"+id+"/people/"+em),{email:em,name:nm,role:"owner"});seedB(b,id);
      return b.commit().then(function(){alert("Company created. The manager can now open the app, choose I am with a company, tap First time? Create my password, and sign in.");ownerDraw()});
    })}).catch(function(e){if(e!=="cancel")dbe(e)});
  }
  // ----- grant or remove manager access for a company -----
  function mgrOpen(id){
    mmC=id;mm.hidden=false;document.body.style.overflow="hidden";
    $("mmb").innerHTML='<div class="meta" style="margin-bottom:8px">Company: <b>'+esc(id)+'</b>. A manager sees everything in this company and can add supervisors and display tablets.</div>'
      +'<input id="mn" placeholder="Manager full name" autocomplete="off" style="margin-bottom:8px"><input id="me" type="email" placeholder="Manager email" autocomplete="off">'
      +'<div class="row"><button id="mgo" type="button">Give manager access</button></div><h2>Current managers</h2><div id="ml" class="meta">Loading...</div>';
    $("mgo").onclick=function(){
      var nm=$("mn").value.trim(),em=$("me").value.trim().toLowerCase(),u=firebase.auth().currentUser;
      if(!nm||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){alert("Type the manager's full name and a valid email.");return}
      RAW.doc("members/"+em).get().then(function(s){
        if(s.exists&&s.data().cid!==mmC){alert("This email already belongs to another company.");return}
        var b=RAW.batch(),now=Date.now();
        b.set(RAW.doc("members/"+em),{email:em,cid:mmC,role:"owner",name:nm,by:u.email,at:now});
        b.set(RAW.doc("companies/"+mmC+"/people/"+em),{email:em,name:nm,role:"owner"});
        b.update(RAW.doc("companies/"+mmC),{owner:em});
        return b.commit().then(function(){$("mn").value="";$("me").value="";mgrList();lst()});
      }).catch(dbe);
    };
    mgrList();
  }
  function mgrList(){
    RAW.collection("members").where("cid","==",mmC).get().then(function(q){
      var m=q.docs.map(function(d){return d.data()}).filter(function(x){return x.role==="owner"&&String(x.email).toLowerCase()!==PLATFORM});
      $("ml").innerHTML=m.length?m.map(function(x){return '<div class="h"><span><b>'+esc(x.name||"")+'</b><br><span class="meta">'+esc(x.email)+'</span></span><button class="ghost" data-e="'+esc(x.email)+'" type="button">Remove</button></div>'}).join(""):'<div class="empty">No manager yet.</div>';
    }).catch(function(e){$("ml").textContent="Could not load: "+((e&&e.message)||e)});
  }
  $("mmb").addEventListener("click",function(e){
    var b=e.target.closest("button[data-e]");if(!b)return;
    if(!confirm("Remove manager access for "+b.dataset.e+"?"))return;
    RAW.doc("members/"+b.dataset.e).delete().then(mgrList).catch(dbe);
  });
  // ----- copy the first version's data into a company -----
  function importOld(cid){
    if(!confirm("Copy the first-version data into company "+cid+"? It is safe to run more than once."))return;
    var u=firebase.auth().currentUser,cols=["active","app","hist","log","audit","people"],st={};
    function release(){return RAW.doc("members/"+PLATFORM).delete().catch(function(){})}
    RAW.doc("members/"+PLATFORM).set({email:PLATFORM,cid:cid,role:"owner",name:"Platform owner",by:u.email,at:Date.now()})
    .then(function(){return RAW.collection("staff").get()})
    .then(function(q){
      q.docs.forEach(function(d){st[d.id.toLowerCase()]=d.data()});
      return Promise.all(cols.map(function(c){return RAW.collection(c).get()}));
    }).then(function(rs){
      var ops=[];
      rs.forEach(function(q,i){q.docs.forEach(function(d){
        var data=d.data();
        if(cols[i]==="people"){var k=d.id.toLowerCase();data=Object.assign({},data,{role:k===PLATFORM?"owner":((st[k]&&st[k].role==="display")?"display":"staff")})}
        ops.push([RAW.doc("companies/"+cid+"/"+cols[i]+"/"+d.id),data]);
      })});
      Object.keys(st).forEach(function(k){
        if(k===PLATFORM)return;
        ops.push([RAW.doc("members/"+k),{email:k,cid:cid,role:st[k].role==="display"?"display":"staff",name:st[k].name||"",by:u.email,at:Date.now()}]);
      });
      var chain=Promise.resolve();
      for(var i=0;i<ops.length;i+=400){(function(part){chain=chain.then(function(){var b=RAW.batch();part.forEach(function(o){b.set(o[0],o[1])});return b.commit()})})(ops.slice(i,i+400))}
      return chain.then(function(){return ops.length});
    }).then(function(c){return release().then(function(){alert("Copied "+c+" records into "+cid+".")})})
    .catch(function(e){release().then(function(){alert("Could not copy: "+((e&&e.message)||e))})});
  }

  // ---------- inside a company, the owner can go back to all companies ----------
  var g2=document.querySelector("#bottombar .bg:nth-child(2) .bgrid")||$("so").parentNode.parentNode;

  var ZX=null;
  function loadZX(){
    if(window.ZXing)return Promise.resolve();
    if(ZX)return ZX;
    ZX=new Promise(function(ok,no){var s=document.createElement("script");s.src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js";s.onload=ok;s.onerror=function(){ZX=null;no(new Error("Could not load the scanner. Check your internet connection."))};document.head.appendChild(s)});
    return ZX;
  }
  function scan(done){
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){alert("This browser cannot use the camera here. Type the number instead.");return}
    var ov=document.createElement("div");
    ov.style.cssText="position:fixed;top:0;right:0;bottom:0;left:0;z-index:99;background:#000;display:flex;flex-direction:column";
    ov.innerHTML='<video id="exVid" playsinline muted autoplay style="flex:1;min-height:0;width:100%;object-fit:cover"></video>'
      +'<div style="position:absolute;left:12%;right:12%;top:40%;height:20%;border:3px solid #38bdf8;border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.35)"></div>'
      +'<div id="exScMsg" style="position:absolute;left:0;right:0;top:calc(14px + env(safe-area-inset-top,0px));text-align:center;color:#fff;font-weight:600">Point the camera at the barcode</div>'
      +'<div style="padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));display:flex"><button id="exScX" type="button" class="ghost" style="width:100%">Cancel</button></div>';
    document.body.appendChild(ov);
    var stream=null,reader=null,timer=null,over=false;
    function stop(){over=true;clearInterval(timer);try{if(reader)reader.reset()}catch(e){}try{if(stream)stream.getTracks().forEach(function(t){t.stop()})}catch(e){}ov.remove()}
    function found(c){if(over)return;stop();try{if(navigator.vibrate)navigator.vibrate(80)}catch(e){}done(String(c).trim())}
    function msg(t){var m=$("exScMsg");if(m)m.textContent=t}
    $("exScX").onclick=stop;
    var vid=$("exVid");
    if(window.BarcodeDetector){
      var det=new BarcodeDetector();
      navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false}).then(function(st){
        if(over){st.getTracks().forEach(function(t){t.stop()});return}
        stream=st;vid.srcObject=st;vid.play().catch(function(){});
        timer=setInterval(function(){det.detect(vid).then(function(r){if(r&&r.length&&r[0].rawValue)found(r[0].rawValue)}).catch(function(){})},250);
      }).catch(function(e){stop();alert("Camera not allowed. In Settings > Safari > Camera, allow this site, then try again.")});
    }else{
      loadZX().then(function(){
        if(over)return;
        reader=new ZXing.BrowserMultiFormatReader();
        return reader.decodeFromConstraints({video:{facingMode:{ideal:"environment"}},audio:false},vid,function(res){if(res)found(res.getText())});
      }).catch(function(e){if(over)return;stop();alert((e&&e.message&&/scanner/.test(e.message))?e.message:"Camera not allowed. In Settings > Safari > Camera, allow this site, then try again.")});
    }
  }

    if(n){var nm2=a.mins+n,upd={mins:nm2,more:null,moreRes:{ok:true,n:n,at:Date.now(),by:me()}};if(nm2*60000>CFG.lead*60000)upd.warnAt=a.start+nm2*60000-CFG.lead*60000;
      DB.doc("active/"+a.id).set(upd,{merge:true}).then(function(){window.alphaNotify(a.id,"more");try{lg("Extra time approved",a.name+" +"+n+" min"+(a.order?" · order #"+a.order:""))}catch(e){}}).catch(dbe)}
    else{DB.doc("active/"+a.id).set({more:null,moreRes:{ok:false,at:Date.now(),by:me()}},{merge:true}).then(function(){window.alphaNotify(a.id,"more");try{lg("Extra time declined",a.name+(a.order?" · order #"+a.order:""))}catch(e){}}).catch(dbe)}
  }
  function paintN(){
    var u=firebase.auth().currentUser;
    if(!ready()||ROLE==="display"||window.INBOUND){box.innerHTML="";lastKeys="__";return}
    var items=[];
    (S.doneQ||[]).forEach(function(a){items.push({k:"d"+a.id,t:"d",a:a})});
    S.active.forEach(function(a){if(a.more&&a.more.at)items.push({k:"m"+a.id+":"+a.more.at,t:"m",a:a})});
    var keys=items.map(function(x){return x.k}).join(",");
    if(keys===lastKeys)return;lastKeys=keys;
    var fresh=false;items.forEach(function(x){if(!known[x.k]){known[x.k]=1;fresh=true}});
    if(fresh){beep(3,900);}
    box.innerHTML=items.map(function(x,i){
      var a=x.a,nm=esc(a.name),od=(a.order?" · order "+esc(a.order):"")+(a.boxes?" · "+a.boxes+" boxes":"");
      if(x.t==="d"){
        var d=a.done||{},spent=Math.max(0,(d.at||Date.now())-a.start),allowed=a.mins*60000,diff=allowed-spent;
        return '<div style="pointer-events:auto;background:var(--card);color:var(--ink);border-left:8px solid '+GRN2+';border-radius:12px;padding:12px;box-shadow:0 6px 18px rgba(0,0,0,.35)"><div style="font-weight:800;font-size:18px">'+nm+' says finished'+od+'</div><div class="meta">Took '+fmt(spent)+' of '+a.mins+' min · '+(diff>=0?fmt(diff)+" early":fmt(-diff)+" over")+' · please check it</div><div class="row" style="margin-top:8px;flex-wrap:wrap"><button type="button" data-ok="'+i+'">Confirm finished</button><button type="button" class="ghost" data-nf="'+i+'">Not finished</button></div></div>';
      }
      var m=a.more,left=a.mins*60000-(m.at-a.start);
      return '<div style="pointer-events:auto;background:var(--card);color:var(--ink);border-left:8px solid '+ORG2+';border-radius:12px;padding:12px;box-shadow:0 6px 18px rgba(0,0,0,.35)"><div style="font-weight:800;font-size:18px">'+nm+' asks for +'+m.mins+' min'+od+'</div><div class="meta">'+(left<0?"Already "+fmt(-left)+" over time":fmt(left)+" was left")+' when asked</div><div class="row" style="margin-top:8px;flex-wrap:wrap"><button type="button" data-yes="'+i+'">Approve +'+m.mins+'</button><button type="button" class="ghost" data-no="'+i+'">Decline</button></div></div>';
    }).join("");
    Array.prototype.forEach.call(box.querySelectorAll("[data-ok]"),function(b){b.onclick=function(){finishDone(items[+b.dataset.ok].a)}});
    Array.prototype.forEach.call(box.querySelectorAll("[data-nf]"),function(b){b.onclick=function(){notDone(items[+b.dataset.nf].a)}});
    Array.prototype.forEach.call(box.querySelectorAll("[data-yes]"),function(b){b.onclick=function(){var a=items[+b.dataset.yes].a;answer(a,a.more.mins)}});
    Array.prototype.forEach.call(box.querySelectorAll("[data-no]"),function(b){b.onclick=function(){answer(items[+b.dataset.no].a,0)}});
  }
  setInterval(paintN,700);
})();

window.__ALPHA_END=1;
</script>
