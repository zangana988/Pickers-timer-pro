<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Picker Timers</title>
<style>
:root{--bg:#eef0ee;--card:#fff;--ink:#1b2220;--mute:#66706c;--line:#d5dad7;--ok:#168a3e;--okbg:#e3f4e8;--bad:#c9261b;--badbg:#fde7e5;--btn:#1b2220;--btnink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141816;--card:#1e2421;--ink:#eef2ef;--mute:#9aa6a0;--line:#2f3833;--ok:#43c46e;--okbg:#17301f;--bad:#ff6b5e;--badbg:#3a1a17;--btn:#eef2ef;--btnink:#141816}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:1100px;margin:0 auto;padding:16px}
#active{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
#done{max-width:720px}
h1{font-size:22px;margin:4px 0 14px}
h2{font-size:16px;margin:24px 0 8px;color:var(--mute)}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
form .wide{grid-column:1/-1}
label{font-size:13px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
input,select{font:inherit;font-size:17px;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
button{font:inherit;font-weight:600;border:0;border-radius:8px;padding:12px 16px;background:var(--btn);color:var(--btnink);cursor:pointer}
button.ghost{background:transparent;color:var(--mute);border:1px solid var(--line)}
.t{border-radius:12px;padding:12px;border:2px solid var(--ok);background:var(--okbg)}
.t.red{border-color:var(--bad);background:var(--badbg)}
.t.late{animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.6}}
@media (prefers-reduced-motion:reduce){.t.late{animation:none}}
.top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.name{font-size:17px;font-weight:700}
.meta{font-size:14px;color:var(--mute)}
.clock{font-size:clamp(38px,11vw,54px);font-weight:700;font-variant-numeric:tabular-nums;color:var(--ok);line-height:1.1;margin:6px 0}
.red .clock{color:var(--bad)}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);width:0}
.red .bar i{background:var(--bad)}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px;flex-wrap:wrap}
.h{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.h b.l{color:var(--bad)}.h b.g{color:var(--ok)}
.empty{color:var(--mute);padding:16px 0}
details{margin-top:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
summary{cursor:pointer;font-weight:600}
.rs{display:flex;gap:8px;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:20px;padding:2px 2px 2px 12px;margin:0 6px 6px 0}
.chip button{padding:2px 10px;background:transparent;color:var(--mute);font-size:18px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line)}
th{color:var(--mute);font-weight:600}
.sc{overflow-x:auto}
.seg{display:flex;gap:8px;margin-bottom:8px}
textarea{width:100%;margin-top:8px;font:13px monospace;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px}
</style>
</head>
<body>
<main>
<h1>Picker timers</h1>
<div id="wn" class="meta" hidden style="color:var(--bad);margin-bottom:8px"></div>
<form id="cf" hidden><label class="wide">First time on this phone: paste your Firebase settings (copy the whole block from the Firebase website)<textarea id="ct" rows="7"></textarea></label><button class="wide" type="submit">Save settings</button></form>
<form id="lg" hidden><label class="wide">Email<input id="le" type="email" autocomplete="username" required></label><label class="wide">Password<input id="lp" type="password" autocomplete="current-password" required></label><button class="wide" type="submit">Sign in</button></form>
<div id="lk" class="row" hidden><button class="ghost" id="lreg" type="button">First time? Create my password</button><button class="ghost" id="lfp" type="button">Forgot password</button></div>
<form id="rg" hidden><label class="wide">Your email (the one the manager added)<input id="re" type="email" autocomplete="username" required></label><label class="wide">Choose your password (8 or more characters)<input id="rp" type="password" autocomplete="new-password" required></label><label class="wide">Repeat the password<input id="rq" type="password" autocomplete="new-password" required></label><button class="wide" type="submit">Create my account</button><button class="wide ghost" id="rbk" type="button">Back to sign in</button></form>
<div id="gt" hidden><div id="gm" class="meta" style="margin:8px 0"></div><div class="row"><button id="gc" type="button">Check again</button><button class="ghost" id="gr" type="button">Resend email</button><button class="ghost" id="gs" type="button">Sign out</button><button class="ghost" id="gpb" type="button" hidden>Open platform console</button></div></div>
<div id="ap" hidden>
<form id="f">
  <label class="wide">Picker<select id="n" required></select></label>
  <label>Order number<input id="o" autocomplete="off" placeholder="e.g. 10452"></label>
  <label>Number of boxes<input id="b" type="number" min="0" value="0" inputmode="numeric"></label>
  <label>Box weight (just estimate)<select id="t"><option value="0.7">Mostly light</option><option value="1" selected>Mixed</option><option value="1.4">Mostly heavy</option></select></label>
  <label>Minutes allowed (change if needed)<input id="m" type="number" min="1" max="600" value="15" required inputmode="numeric"></label>
  <div class="wide meta" id="sg">Enter the boxes to get a suggested time.</div>
  <button class="wide" type="submit">Start timer</button>
</form>
<details id="mg"><summary>Manage picker list</summary><div class="rs"><input id="rn" placeholder="Add picker name" autocomplete="off"><button type="button" id="ra">Add</button></div><div id="rl"></div></details>
<h2 id="cnt">In progress</h2>
<div id="active"></div>
<h2>Finished today</h2>
<div id="done"></div>
<h2>Picker statistics</h2>
<div class="seg"><button type="button" data-p="3">Last 3 months</button><button type="button" data-p="6">Last 6 months</button></div>
<div id="st"></div>
<div class="row"><button type="button" id="cp">Copy data for Excel</button><button type="button" class="ghost" id="dl">Download CSV</button></div>
<textarea id="ta" rows="8" readonly hidden></textarea>
<div class="row"><button class="ghost" id="so" type="button">Sign out</button></div>
</div>
</main>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>

try{var sv=JSON.parse(localStorage.getItem("fbcfg"));if(sv&&sv.projectId)FIREBASE_CONFIG=sv}catch(e){}

function who(e){if(!e)return "unknown";var l=String(e).toLowerCase(),cu=firebase.auth().currentUser,n=PEOPLE[l]||String(e).split("@")[0],r=(cu&&(cu.email||"").toLowerCase()===l)?ROLE:PROLE[l];return n+(r==="owner"?" (Manager)":r==="display"?" (Display)":" (Supervisor)")}

  e.preventDefault();

function finish(id){
  var i=S.active.findIndex(function(a){return a.id===id});
  if(i<0)return;

  var a=Object.assign({},S.active[i]);a.end=Date.now();a.doneBy=me();
  var ref=DB.doc("hist/"+dayStr(new Date(a.end))+"_"+hk(a.name));
  ref.get().then(function(s){var it=s.exists?(s.data().items||[]).slice():[];it.push(a);return ref.set({day:dayStr(new Date(a.end)),name:a.name,items:it})}).then(function(){return DB.doc("active/"+id).delete()}).catch(function(e){delete fin[id];dbe(e)});
}
function cancel(id){
  if(!confirm("Remove this timer without saving it?"))return;
  if(DB)DB.doc("active/"+id).delete().catch(dbe);
}

$("active").onclick=function(e){
  var b=e.target.closest("button");if(!b)return;
  var id=+b.dataset.id;b.dataset.a==="done"?finish(id):cancel(id);
};
function render(){
  fillSel();var now=Date.now(),h="";
  var nl=0;
  S.active.slice().sort(function(x,y){return (x.start+x.mins*60000)-(y.start+y.mins*60000)}).forEach(function(a){
    var tot=a.mins*60000,left=tot-(now-a.start),late=left<0;
    var red=late||left<=tot*0.2;if(red)nl++;
    var pct=Math.min(100,Math.max(0,(now-a.start)/tot*100));
    h+='<div class="t'+(red?" red":"")+(late?" late":"")+'"><div class="top"><span class="name">'+esc(a.name)+'</span><span class="meta">'+(a.order?"Order "+esc(a.order):"")+(a.boxes?(a.order?" · ":"")+a.boxes+" boxes":"")+'</span></div>'
    +'<div class="clock">'+(late?"+":"")+fmt(left)+'</div>'
    +'<div class="bar"><i style="width:'+pct+'%"></i></div>'
    +'<div class="row"><span class="meta">Started '+tm(a.start)+' · Given '+a.mins+' min'+(late?" · OVER TIME":"")+'</span></div>'+(a.by?'<div class="meta">Assigned by '+esc(who(a.by))+'</div>':'')
    +'<div class="row"><button data-a="done" data-id="'+a.id+'">Finished order</button><button class="ghost" data-a="x" data-id="'+a.id+'">Remove</button></div></div>';
  });
  $("active").innerHTML=h||'<div class="empty">No one is picking right now. Start a timer above.</div>';
  $("cnt").textContent="In progress ("+S.active.length+(nl?", "+nl+" red":"")+")";
  var d="";
  var t0=new Date().setHours(0,0,0,0);S.done.filter(function(a){return a.end>=t0}).forEach(function(a){
    var took=a.end-a.start,over=took>a.mins*60000;
    d+='<div class="h"><span>'+esc(a.name)+(a.order?" · #"+esc(a.order):"")+(a.boxes?" · "+a.boxes+" boxes":"")+'<br><span class="meta">'+tm(a.start)+" to "+tm(a.end)+" · given "+a.mins+' min · '+(over?fmt(took-a.mins*60000)+" over":fmt(a.mins*60000-took)+" early")+(byline(a)?'<br>'+esc(byline(a)):'')+'</span></span><b class="'+(over?"l":"g")+'">'+fmt(took)+'</b></div>';
  });
  $("done").innerHTML=d||'<div class="empty">Finished orders appear here.</div>';
}
var lastKey=null;
function fillSel(){
  var busy=S.active.map(function(a){return a.name}),av=S.roster.filter(function(n){return busy.indexOf(n)<0}),key=av.join("|")+"#"+S.roster.length;
  if(key===lastKey)return;lastKey=key;
  var s=$("n");
  s.innerHTML=av.length?'<option value="">Choose picker</option>'+av.map(function(n){return '<option>'+esc(n)+'</option>'}).join(""):'<option value="">'+(S.roster.length?"Everyone is busy":"Add pickers in the list below first")+'</option>';
}
function rr(){
  $("rl").innerHTML=S.roster.map(function(n,i){return '<span class="chip">'+esc(n)+'<button type="button" data-i="'+i+'" aria-label="Remove '+esc(n)+'">×</button></span>'}).join("");
  if(!S.roster.length)$("mg").open=true;
  lastKey=null;fillSel();
}
function addP(){
  var v=$("rn").value.trim();if(!v)return;
  if(S.roster.indexOf(v)<0)S.roster.push(v);
  S.roster.sort(function(a,b){return a.localeCompare(b)});
  $("rn").value="";saveRoster();rr();$("rn").focus();
}
$("ra").onclick=addP;
$("rn").onkeydown=function(e){if(e.key==="Enter"){e.preventDefault();addP()}};

// Time estimate: setup + walking in a ~2,000 m2 warehouse + handling per box weight class + extra trips when cart is full
var KG=[1,6,15],SEC=[15,25,45],CART=120;
function boxes(){return [Math.max(0,Math.floor(+$("b").value||0)),+$("t").value||1]}
function est(c){
  var n=c[0],k=c[1];if(!n)return 0;
  var kg=n*6*k;
  return CFG.setup+n*CFG.walk+n*CFG.handle*k+(Math.max(1,Math.ceil(kg/CFG.cart))-1)*90;
}
function factor(){
  var r=S.done.filter(function(a){return a.est}).slice(0,20).map(function(a){return (a.end-a.start)/1000/a.est});
  if(r.length<3)return{f:1,n:r.length};
  var f=r.reduce(function(x,y){return x+y},0)/r.length;
  return{f:Math.min(2,Math.max(0.5,f)),n:r.length};
}
function upd(){
  var c=boxes(),n=c[0];
  if(!n){$("sg").textContent="Enter the boxes to get a suggested time.";return}
  var F=factor(),m=Math.max(1,Math.ceil(est(c)*F.f*(1+CFG.buf/100)/60));
  $("m").value=m;
  $("sg").textContent="Suggested: "+m+" min for "+n+" boxes. "+(F.n>=3?"Adjusted from your last "+F.n+" finished orders.":"Standard estimate; it adapts after 3 finished orders.");
}
$("b").oninput=upd;$("t").onchange=upd;
var per=3;
function stats(){
  var from=new Date();from.setMonth(from.getMonth()-per);var g={};
  S.done.filter(function(a){return a.end>=from.getTime()}).forEach(function(a){
    var r=g[a.name]||(g[a.name]={n:0,b:0,bs:0,s:0,ok:0,d:0,ov:0,er:0}),s=(a.end-a.start)/1000;
    r.n++;r.s+=s;if(a.boxes){r.b+=a.boxes;r.bs+=s}if(s<=a.mins*60)r.ok++;var df=a.mins*60-s;r.d+=df;if(df<0)r.ov-=df;else r.er+=df;
  });
  var ns=Object.keys(g).sort(function(x,y){return g[y].ok/g[y].n-g[x].ok/g[x].n});
  $("st").innerHTML=ns.length?'<div class="sc"><table><tr><th>Picker</th><th>Orders</th><th>Avg min/order</th><th>Sec/box</th><th>On time</th><th>Avg early (+) / over (-)</th><th>Total over</th><th>Total early</th></tr>'+ns.map(function(n){var r=g[n];return '<tr><td>'+esc(n)+'</td><td>'+r.n+'</td><td>'+(r.s/r.n/60).toFixed(1)+'</td><td>'+(r.b?Math.round(r.bs/r.b):"-")+'</td><td>'+Math.round(r.ok/r.n*100)+'%</td><td>'+sg(r.d/r.n)+'</td><td>'+Math.round(r.ov/60)+' min</td><td>'+Math.round(r.er/60)+' min</td></tr>'}).join("")+'</table></div>':'<div class="empty">No finished orders in this period yet.</div>';
  Array.prototype.forEach.call(document.querySelectorAll(".seg button"),function(b){b.className=(+b.dataset.p===per?"":"ghost")});
}
document.querySelector(".seg").onclick=function(e){var b=e.target.closest("button");if(!b)return;per=+b.dataset.p;stats()};
function sg(x){var m=Math.abs(x)/60;return (x>=0?"+":"-")+m.toFixed(1)+" min"}

  var h=["Picker","Order","Date","Start","End","Boxes","Allowed min","Actual min","Difference min (+ early, - over)","On time","Sec per box","Assigned by","Finished by"];
  return [h].concat(S.done.slice().reverse().map(function(a){
    var d=new Date(a.start),m=(a.end-a.start)/60000;
    return [a.name,a.order||"",d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),tm(a.start),tm(a.end),a.boxes||"",a.mins,m.toFixed(1),(a.mins-m).toFixed(1),m<=a.mins?"Yes":"No",a.boxes?Math.round(m*60/a.boxes):"",a.by||"",a.doneBy||""];
  }));

(async function(){

  function btnStyle(k){return k===flt?"":"background:transparent;color:var(--ink);border:2px solid var(--line)"}
  function draw(){
    var n=counts(),t=today0(),l1=addM(t,1),l3=addM(t,3),l6=addM(t,6);
    var F=[["all","All"],["exp","Expired"],["w1","1 month"],["w3","3 months"],["w6","6 months"]];
    $("exc").innerHTML=F.map(function(f){return '<button type="button" data-f="'+f[0]+'" style="padding:10px 6px;font-size:15px;'+btnStyle(f[0])+'">'+f[1]+'<div style="font-size:20px;font-weight:800;margin-top:2px">'+n[f[0]]+'</div></button>'}).join("");
    Array.prototype.forEach.call($("exc").querySelectorAll("button"),function(b){b.onclick=function(){flt=b.dataset.f;lim=300;draw()}});
    var ql=q.trim().toLowerCase();
    var list=ROWS.map(function(r){return {r:r,i:info(r,t,l1,l3,l6)}}).filter(function(x){
      if(flt==="exp"&&x.i.k!=="exp")return false;
      if(flt==="w1"&&x.i.k!=="w1")return false;
      if(flt==="w3"&&x.i.k!=="w1"&&x.i.k!=="w3")return false;
      if(flt==="w6"&&x.i.k!=="w1"&&x.i.k!=="w3"&&x.i.k!=="w6")return false;
      return !ql||(x.r.l+" "+x.r.p).toLowerCase().indexOf(ql)>=0;
    });
    list.sort(function(a,b){return a.r.e<b.r.e?-1:a.r.e>b.r.e?1:0});
    var h=list.slice(0,lim).map(function(x){
      return '<div style="border-left:6px solid '+x.i.c+';background:var(--card);border-radius:10px;padding:10px 12px;margin-bottom:8px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;box-shadow:0 1px 2px rgba(0,0,0,.10)">'
        +'<div style="font-weight:700;overflow-wrap:anywhere">'+esc(x.r.p||"(no name)")+'</div><div style="font-weight:800;color:'+x.i.c+'">'+show(x.r.e)+'</div>'
        +'<div class="meta" style="overflow-wrap:anywhere">Location: '+esc(x.r.l||"-")+'</div><div class="meta" style="text-align:right">'+x.i.left+'</div></div>';
    }).join("");
    if(!list.length)h='<div class="empty">'+(ROWS.length?"Nothing matches this filter.":"No products yet. Open Import from Excel below.")+'</div>';
    if(list.length>lim)h+='<div class="row"><button id="exmore" type="button" class="ghost">Show more ('+(list.length-lim)+' left)</button></div>';
    $("exl").innerHTML='<div class="meta" style="margin-bottom:8px">'+list.length+' product'+(list.length===1?"":"s")+' · <b style="color:'+RED+'">red</b> expired · <b style="color:'+ORG+'">orange</b> within 1 month · <b style="color:'+YEL+'">yellow</b> within 3 months · <b style="color:'+GRN+'">green</b> later</div>'+h;
    var mo=$("exmore");if(mo)mo.onclick=function(){lim+=300;draw()};
    $("exi").open=!ROWS.length||$("exi").open;
  }
  $("exq").oninput=function(){q=this.value;lim=300;draw()};

  // ---------- shared data ----------
  function subscribe(){
    if(sub||!DB||ROLE!=="owner")return;sub=true;
    DB.collection("app").onSnapshot(function(s){
      var parts=[],meta=null;
      s.docs.forEach(function(d){
        var m=/^exp_(\d+)$/.exec(d.id);if(m)parts.push([+m[1],(d.data().rows)||[]]);
        else if(d.id==="expmeta")meta=d.data();
      });
      parts.sort(function(a,b){return a[0]-b[0]});
      ROWS=[];parts.forEach(function(p){ROWS=ROWS.concat(p[1])});
      META=meta||{n:parts.length,count:ROWS.length};
      $("exs").textContent=meta&&meta.at?"Last import: "+new Date(meta.at).toLocaleString()+(meta.file?" · "+meta.file:"")+" · "+ROWS.length+" products":(ROWS.length?ROWS.length+" products":"");
      var first=!loaded;loaded=true;drawHub();draw();
      if(first&&!alerted)alertOnOpen();
    },function(){$("exs").textContent="Cannot read the expiry data. Check your connection and manager access."});
  }
  function alertOnOpen(){
    var n=counts();alerted=true;
    if(!n.exp&&!n.w1)return;
    var a=document.createElement("div");
    a.style.cssText="position:fixed;top:0;right:0;bottom:0;left:0;z-index:95;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;padding:20px";
    a.innerHTML='<div style="background:var(--card);color:var(--ink);border-radius:16px;padding:22px;max-width:380px;width:100%;text-align:center;border-top:8px solid '+(n.exp?RED:ORG)+'">'
      +'<div style="font-size:42px;line-height:1">&#9888;</div><h2 style="margin:8px 0">Expiry alert</h2>'
      +(n.exp?'<div style="font-size:18px;color:'+RED+';font-weight:800">'+n.exp+' product'+(n.exp===1?"":"s")+' expired</div>':"")
      +(n.w1?'<div style="font-size:18px;color:'+ORG+';font-weight:800;margin-top:4px">'+n.w1+' expiring within 1 month</div>':"")
      +'<div class="row" style="margin-top:18px"><button id="axo" type="button">Open Expirations</button><button id="axl" type="button" class="ghost">Later</button></div></div>';
    document.body.appendChild(a);
    $("axl").onclick=function(){a.remove()};
    $("axo").onclick=function(){a.remove();flt=n.exp?"exp":"w1";page="exp";sync();draw()};
  }

  // ---------- Excel / CSV reading ----------
  function u16(v,o){return v.getUint16(o,true)}function u32(v,o){return v.getUint32(o,true)}
  function inflate(u8){
    if(typeof DecompressionStream==="undefined")return Promise.reject(new Error("This browser cannot open .xlsx here. Save the file as CSV and choose it again."));
    var ds=new DecompressionStream("deflate-raw"),w=ds.writable.getWriter();w.write(u8);w.close();
    return new Response(ds.readable).arrayBuffer().then(function(b){return new Uint8Array(b)});
  }
  function unzip(buf){
    var v=new DataView(buf),u8=new Uint8Array(buf),e=-1,i;
    for(i=buf.byteLength-22;i>=Math.max(0,buf.byteLength-66000);i--){if(u32(v,i)===0x06054b50){e=i;break}}
    if(e<0)throw new Error("This is not an .xlsx file.");
    var n=u16(v,e+10),p=u32(v,e+16),files={},dec=new TextDecoder();
    for(var k=0;k<n;k++){
      if(u32(v,p)!==0x02014b50)break;
      var nl=u16(v,p+28),el=u16(v,p+30),cl=u16(v,p+32);
      files[dec.decode(u8.subarray(p+46,p+46+nl))]={m:u16(v,p+10),cs:u32(v,p+20),lo:u32(v,p+42)};
      p+=46+nl+el+cl;
    }
    function get(name){
      var f=files[name];if(!f)return Promise.resolve(null);
      var s=f.lo+30+u16(v,f.lo+26)+u16(v,f.lo+28),d=new Uint8Array(buf,s,f.cs);
      return (f.m===0?Promise.resolve(d):inflate(d)).then(function(x){return new TextDecoder().decode(x)});
    }
    return {names:Object.keys(files),get:get};
  }
  function xml(s){return new DOMParser().parseFromString(s,"application/xml")}
  function colIdx(ref){var m=/^([A-Z]+)/.exec(ref||"");if(!m)return 0;var n=0;for(var i=0;i<m[1].length;i++)n=n*26+m[1].charCodeAt(i)-64;return n-1}
  function readXlsx(buf){
    var z=unzip(buf),SS=[],sheet="xl/worksheets/sheet1.xml";
    return z.get("xl/sharedStrings.xml").then(function(t){
      if(t)Array.prototype.forEach.call(xml(t).getElementsByTagName("si"),function(si){
        var s="";Array.prototype.forEach.call(si.getElementsByTagName("t"),function(x){if(!x.parentNode||x.parentNode.nodeName!=="rPh")s+=x.textContent});SS.push(s)});
      return Promise.all([z.get("xl/workbook.xml"),z.get("xl/_rels/workbook.xml.rels")]);
    }).then(function(a){
      try{
        var sh=xml(a[0]).getElementsByTagName("sheet")[0],rid=sh&&(sh.getAttribute("r:id")||sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id"));
        Array.prototype.forEach.call(xml(a[1]).getElementsByTagName("Relationship"),function(r){
          if(r.getAttribute("Id")===rid){var t=r.getAttribute("Target").replace(/^\/?(xl\/)?/,"");sheet="xl/"+t}});
      }catch(e){}
      if(z.names.indexOf(sheet)<0){sheet=z.names.filter(function(n){return /^xl\/worksheets\/sheet\d+\.xml$/.test(n)}).sort()[0]}
      return z.get(sheet);
    }).then(function(t){
      if(!t)throw new Error("No sheet found in this file.");
      var rows=[];
      Array.prototype.forEach.call(xml(t).getElementsByTagName("row"),function(r){
        var row=[];
        Array.prototype.forEach.call(r.getElementsByTagName("c"),function(c){
          var ty=c.getAttribute("t"),ve=c.getElementsByTagName("v")[0],v=ve?ve.textContent:"";
          if(ty==="s")v=SS[+v]||"";
          else if(ty==="inlineStr"){v="";Array.prototype.forEach.call(c.getElementsByTagName("t"),function(x){v+=x.textContent})}
          else if(ty!=="str"&&ty!=="e"&&ty!=="b"&&v!==""&&!isNaN(+v))v=+v;
          var i=colIdx(c.getAttribute("r"));while(row.length<i)row.push("");row[i]=v;
        });
        rows.push(row);
      });
      return rows;
    });
  }
  function readCsv(text){
    text=text.replace(/^﻿/,"");
    var first=text.split(/\r?\n/)[0]||"",d=";",best=0;
    [";",",","\t"].forEach(function(c){var k=first.split(c).length;if(k>best){best=k;d=c}});
    var rows=[],row=[],cur="",inq=false;
    for(var i=0;i<text.length;i++){
      var ch=text[i];
      if(inq){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else inq=false}else cur+=ch}
      else if(ch==='"')inq=true;
      else if(ch===d){row.push(cur);cur=""}
      else if(ch==="\n"||ch==="\r"){if(ch==="\r"&&text[i+1]==="\n")i++;row.push(cur);cur="";rows.push(row);row=[]}
      else cur+=ch;
    }
    if(cur!==""||row.length){row.push(cur);rows.push(row)}
    return rows;
  }

  // ---------- import screen ----------
  function letter(i){var s="";i++;while(i>0){var m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26)}return s}
  $("exf").onchange=function(){
    var f=this.files[0],box=$("exmap");if(!f)return;
    box.innerHTML='<div class="meta">Reading...</div>';
    var isCsv=/\.(csv|txt)$/i.test(f.name),fr=new FileReader();
    fr.onerror=function(){box.innerHTML='<div class="meta" style="color:var(--bad)">Could not read the file.</div>'};
    fr.onload=function(){
      var p;
      try{p=isCsv?Promise.resolve(readCsv(fr.result)):readXlsx(fr.result)}catch(e){p=Promise.reject(e)}
      p.then(function(rows){choose(rows,f.name)}).catch(function(e){box.innerHTML='<div class="meta" style="color:var(--bad)">'+esc((e&&e.message)||"Could not open this file. Use .xlsx or .csv.")+'</div>'});
    };
    if(isCsv)fr.readAsText(f);else fr.readAsArrayBuffer(f);
  };
  function choose(rows,fname){
    rows=rows.filter(function(r){return r.some(function(c){return String(c).trim()!==""})});
    if(!rows.length){$("exmap").innerHTML='<div class="meta" style="color:var(--bad)">The file is empty.</div>';return}
    var w=0;rows.forEach(function(r){if(r.length>w)w=r.length});
    var head=rows[0],hasHead=head.some(function(c){return typeof c==="string"&&c.trim()!==""&&!toISO(c)})&&!head.some(function(c){return toISO(c)});
    var names=[];for(var i=0;i<w;i++)names.push(hasHead&&String(head[i]||"").trim()?String(head[i]).trim():"Column "+letter(i));
    function find(re,skip){for(var i=0;i<w;i++)if(skip.indexOf(i)<0&&hasHead&&re.test(String(head[i]||"")))return i;return -1}
    var ie=find(/exp|best|valid|use by|until|date/i,[]),il=find(/loc|shelf|place|bay|aisle|rack|position|zone/i,[ie]),ip=find(/prod|item|name|desc|article|sku|material/i,[ie,il]);
    var free=[0,1,2,3,4,5].filter(function(x){return x<w&&x!==ie&&x!==il&&x!==ip});
    if(il<0)il=free.shift();if(ip<0)ip=free.shift();if(ie<0)ie=free.shift();
    if(il===undefined)il=0;if(ip===undefined)ip=Math.min(1,w-1);if(ie===undefined)ie=Math.min(2,w-1);
    function sel(id,v){return '<select id="'+id+'" style="margin-bottom:8px">'+names.map(function(n,i){return '<option value="'+i+'"'+(i===v?" selected":"")+'>'+esc(n)+'</option>'}).join("")+'</select>'}
    $("exmap").innerHTML='<div class="meta" style="margin-bottom:6px">File: '+esc(fname)+' · '+rows.length+' rows. Check which column is which:</div>'
      +'<label class="wide">Location column'+sel("exL",il)+'</label><label class="wide">Product column'+sel("exP",ip)+'</label><label class="wide">Expiry date column'+sel("exE",ie)+'</label>'
      +'<div id="exPv" class="meta" style="margin-bottom:8px"></div><div class="row"><button id="exGo" type="button">Import</button></div>';
    var body=hasHead?rows.slice(1):rows;
    function build(){
      var a=+$("exL").value,b=+$("exP").value,c=+$("exE").value,out=[],bad=0;
      body.forEach(function(r){
        var l=String(r[a]===undefined?"":r[a]).trim(),p=String(r[b]===undefined?"":r[b]).trim(),e=toISO(r[c]);
        if(!l&&!p&&(r[c]===undefined||r[c]===""))return;
        if(!e||!p&&!l){bad++;return}
        out.push({l:l,p:p,e:e});
      });
      PEND={rows:out,bad:bad,file:fname};
      var s=out.slice(0,3).map(function(x){return esc(x.p)+" · "+esc(x.l)+" · "+show(x.e)}).join("<br>");
      $("exPv").innerHTML='<b>'+out.length+'</b> products ready'+(bad?' · <span style="color:var(--bad)">'+bad+' rows skipped (no valid date)</span>':"")+(s?'<br>Example:<br>'+s:"");
      $("exGo").textContent="Import "+out.length+" products";$("exGo").disabled=!out.length;
    }
    ["exL","exP","exE"].forEach(function(id){$(id).onchange=build});build();
    $("exGo").onclick=function(){doImport()};
  }
  function doImport(){
    if(!PEND||!PEND.rows.length)return;
    if(ROWS.length&&!confirm("This replaces the current list of "+ROWS.length+" products with "+PEND.rows.length+" new ones. Continue?"))return;
    var u=firebase.auth().currentUser,rows=PEND.rows,n=Math.ceil(rows.length/CH),b=DB.batch(),i,old=Math.max(META.n||0,0);
    for(i=0;i<n;i++)b.set(DB.doc("app/exp_"+i),{rows:rows.slice(i*CH,(i+1)*CH)});
    for(i=n;i<old+1;i++)b.delete(DB.doc("app/exp_"+i));
    b.set(DB.doc("app/expmeta"),{n:n,count:rows.length,at:Date.now(),by:u?u.email:"",file:PEND.file});
    $("exGo").disabled=true;$("exGo").textContent="Saving...";
    b.commit().then(function(){
      try{lg("Expiry list imported",rows.length+" products from "+PEND.file)}catch(e){}
      $("exmap").innerHTML='<div class="meta" style="color:var(--ok);font-weight:700">Imported '+rows.length+' products.</div>';$("exf").value="";PEND=null;$("exi").open=false;
    }).catch(function(e){$("exGo").disabled=false;$("exGo").textContent="Import";dbe(e)});
  }
  $("exclr").onclick=function(){
    if(!ROWS.length)return;
    if(!confirm("Delete the whole expiry list ("+ROWS.length+" products)?"))return;
    if(!confirm("Are you sure? This cannot be undone."))return;
    var b=DB.batch(),i,old=Math.max(META.n||0,Math.ceil(ROWS.length/CH));
    for(i=0;i<old+1;i++)b.delete(DB.doc("app/exp_"+i));
    b.delete(DB.doc("app/expmeta"));
    b.commit().catch(dbe);
  };
  sync();
})();
</script>
